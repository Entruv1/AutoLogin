name: Build & Release

# 触发时机：
#   * 推到 main            → 构建 + 语法自检，产物作为 Artifact 留存（不发 Release）
#   * 推 v* 标签（如 v1.0.0）→ 构建 + 自动创建 GitHub Release 并附上 exe
#   * Pull Request          → 只验证能否构建成功
#   * 手动 workflow_dispatch → 随时手点一次构建
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 创建 Release 需要写权限
permissions:
  contents: write

# 同一个分支/标签上重复触发时，取消上一次还在跑的构建
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # PyInstaller 在 CI 上不需要 UPX
  PYTHONIOENCODING: utf-8

jobs:
  build:
    name: 打包 Windows 单文件 exe
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -c "import cv2, numpy, onnxruntime, shapely, pystray, PIL; print('依赖就绪')"

      - name: 语法自检
        shell: bash
        run: python -m py_compile src/*.py captcha_recognizer/*.py

      - name: 打包 exe
        shell: bash
        run: |
          python -m PyInstaller --noconfirm --distpath dist --workpath build auto_login_vision.spec

      - name: 校验产物
        shell: bash
        run: |
          ls -la dist/
          if [ ! -f dist/auto_login_vision.exe ]; then
            echo "::error::没有生成 dist/auto_login_vision.exe"
            exit 1
          fi
          size=$(stat -c%s dist/auto_login_vision.exe)
          echo "exe 体积 = $size 字节（约 $((size / 1024 / 1024)) MB）"
          # 模型 40MB + onnxruntime 几十 MB，正常产物不会小于 80MB；过小说明依赖没打进去
          if [ "$size" -lt 80000000 ]; then
            echo "::error::exe 体积异常（$size 字节），可能缺少模型或 onnxruntime"
            exit 1
          fi

      - name: 冻结自检
        # 跑一遍刚打出来的 exe，确认模型、onnxruntime、配置导出/导入在冻结环境里真的能用。
        # 直接 grep exe 是验不出来的 —— 单文件模式里 pyc 是压缩存在 PYZ 中的，
        # 搜字符串恒为 0 命中，那不代表功能没打进去。
        shell: bash
        run: |
          rm -f dist/_debug/selftest.txt
          rc=0
          dist/auto_login_vision.exe --selftest || rc=$?
          echo "自检退出码 = $rc"
          # exe 是 --windowed 构建的、没有控制台，结果落在同目录的 _debug/selftest.txt
          for _ in $(seq 1 20); do
            if [ -f dist/_debug/selftest.txt ]; then break; fi
            sleep 1
          done
          if [ ! -f dist/_debug/selftest.txt ]; then
            echo "::error::没有生成 dist/_debug/selftest.txt，自检根本没跑起来"
            exit 1
          fi
          echo "----- selftest.txt -----"
          cat dist/_debug/selftest.txt
          if [ "$rc" -ne 0 ]; then
            echo "::error::冻结自检未通过（退出码 $rc）"
            exit 1
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: auto_login_vision-win64
          path: |
            dist/auto_login_vision.exe
            config.example.json
            README.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: 发布 Release
        # 只有推 v* 标签时才发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/auto_login_vision.exe
            config.example.json
          generate_release_notes: true
          body: |
            Windows 单文件绿色版，**下载 `auto_login_vision.exe` 直接双击**即可，无需安装 Python。

            ### 首次使用

            1. 把 `config.example.json` 下载下来，改名成 `config.json`，和 exe 放在同一目录；
            2. 编辑里面的站点地址、窗口标题关键字、账号信息（密码 base64 混淆，可用
               `python -c "import base64;print(base64.b64encode('你的密码'.encode()).decode())"` 生成）；
            3. 双击 exe，托盘出现图标后按热键，即自动完成 **打开网页 → 切到前台 → 登录**。

            右键托盘图标 → `设置…` 可以图形化改配置，不用手写 JSON；
            界面里还能把配置整体**导出成文件 / 从文件导入**，换机器时不用重敲。

            详见 [README](https://github.com/${{ github.repository }}#readme)。
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
